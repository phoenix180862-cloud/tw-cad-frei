<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="frei-config.js?v=20261028-0429"></script>
<title>TW-CAD Hilfe</title>
<style>
  :root { --bg:#12161b; --bg2:#181d24; --bg3:#20262e; --line:#313944; --tx:#e7eaee; --tx2:#a9b1bc; --gelb:#facc15; }
  * { box-sizing: border-box; } html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx); font: 14px/1.45 Inter, "Segoe UI", Arial, sans-serif; }
  body { display: grid; grid-template-rows: auto auto auto 1fr; grid-template-columns: minmax(0, 1fr); overflow-x: hidden; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 10px; background: var(--bg2); border-bottom: 1px solid var(--line); }
  header b { color: var(--gelb); } select { flex: 1; min-width: 0; width: 0; background: var(--bg); color: var(--tx); border: 1px solid var(--line); border-radius: 6px; padding: 5px; }
  label.f { font-size: 12px; color: var(--tx2); display: flex; gap: 5px; align-items: center; white-space: nowrap; }
  .vid { background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
  video { width: 100%; max-height: 52vh; display: block; }
  .novid { color: var(--tx2); padding: 18px; text-align: center; font-size: 13px; }
  main { overflow: auto; padding: 10px 14px 20px; }
  h2 { font-size: 16px; margin: 4px 0 8px; }
  ol { padding-left: 22px; margin: 0; } li { margin: 0 0 7px; }
  .ton { display: flex; gap: 6px; align-items: center; padding: 6px 10px; background: var(--bg2); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .ton .btn { min-width: 40px; font-size: 15px; font-weight: 700; padding: 6px 10px; }
  .ton .lbl { color: var(--gelb); font-weight: 700; font-size: 13px; white-space: nowrap; }
  .ton input[type=range] { flex: 1; min-width: 90px; height: 28px; accent-color: #facc15; cursor: pointer; }
  .ton .wert { min-width: 46px; text-align: right; color: var(--tx2); font-variant-numeric: tabular-nums; }
  .tonan { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--gelb); color: #111; border: 0; border-radius: 999px; padding: 12px 20px; font: 700 16px Inter, Arial; cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .btn { background: var(--bg3); color: var(--tx); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; cursor: pointer; }
</style>
</head>
<body>
<header><b>▶ Hilfe</b><select id="thema"></select><label class="f"><input type="checkbox" id="folgen" checked> folgt der Arbeit</label><button class="btn" id="hb" title="Handbuch (PDF)">Handbuch</button></header>
<div class="vid" id="vid"></div>
<div class="ton" id="ton"><span class="lbl">🔊 Lautstärke</span><button class="btn" id="leiser" title="leiser (Taste −)">−</button><input type="range" id="regler" min="0" max="100" step="5" title="Lautstärke – ziehen oder − / + drücken" aria-label="Lautstärke"><button class="btn" id="lauter" title="lauter (Taste +)">+</button><span class="wert" id="wert"></span><button class="btn" id="stumm" title="Ton aus/an (Taste M)">🔊</button><button class="btn" id="nochmal" title="Video von vorn">↻ von vorn</button></div>
<main><h2 id="titel"></h2><ol id="schritte"></ol></main>
<script type="module">
import { HILFE } from './js/help-data.js?v=20261028-0429';
import * as I18N from './js/i18n.js?v=20261028-0429';
const SPR = await I18N.laden(); I18N.beobachten(document);
const FREI_A = window.TW_FREI === true;
// Videos: eigene Aufnahme in der gewählten Sprache (videos-frei/<sprache>/), sonst die deutschen Videos
function videoQuellen(id) {
  const q = [];
  if (FREI_A || SPR !== 'de') q.push(`hilfe/videos-frei/${SPR}/${id}.webm`);
  if (FREI_A && SPR !== 'de') q.push(`hilfe/videos-frei/de/${id}.webm`);
  q.push(`hilfe/videos/${id}.webm`);
  return q;
}
const q = new URLSearchParams(location.search);
const sel = document.getElementById('thema');
for (const t of HILFE) sel.append(new Option(I18N.tr(t.titel), t.id));
let aktuell = null;
function zeige(id) {
  const t = HILFE.find(x => x.id === id) || HILFE[0]; if (aktuell === t.id) return; aktuell = t.id; sel.value = t.id;
  document.getElementById('titel').textContent = I18N.tr(t.titel);
  const ol = document.getElementById('schritte'); ol.innerHTML = ''; for (const s of t.schritte) { const li = document.createElement('li'); li.textContent = I18N.tr(s); ol.append(li); }
  const v = document.getElementById('vid'); v.innerHTML = '';
  const video = document.createElement('video'); video.controls = true; video.playsInline = true; video.preload = 'auto';
  const quellen = videoQuellen(t.id); let qi = 0; const VV = '?v=20261027-1';
  video.src = quellen[qi] + VV;
  video.onerror = () => { qi++; if (qi < quellen.length) { video.src = quellen[qi] + VV; abspielen(); return; } v.innerHTML = '<div class="novid">' + I18N.tr('Für diesen Schritt gibt es noch kein Video – die Kurzanleitung steht unten.') + '</div>'; };
  video.onvolumechange = () => { if (performance.now() < (video._ign || 0)) { anzeigen(); return; } if (Math.abs(video.volume - ton.vol) > 0.001 || video.muted !== ton.stumm) { ton.vol = video.volume; ton.stumm = video.muted; merken(); } anzeigen(); };
  v.append(video); aktVideo = video; tonSetzen(); abspielen();
}
// ───── Ton: Lautstärke +/−, stumm, Autoplay mit Ton (sonst Knopf „Ton an“) ─────
let aktVideo = null; const ton = { vol: 0.8, stumm: false };
try { const o = JSON.parse(localStorage.getItem('twcad_hilfe_ton') || 'null'); if (o) Object.assign(ton, o); } catch (e) {}
function merken() { try { localStorage.setItem('twcad_hilfe_ton', JSON.stringify(ton)); } catch (e) {} }
function anzeigen() { const rg = document.getElementById('regler'); if (document.activeElement !== rg) rg.value = ton.stumm ? 0 : Math.round(ton.vol * 100); document.getElementById('wert').textContent = ton.stumm ? 'stumm' : Math.round(ton.vol * 100) + ' %'; document.getElementById('stumm').textContent = ton.stumm || ton.vol === 0 ? '🔇' : '🔊'; }
function tonSetzen() { if (aktVideo) { aktVideo._ign = performance.now() + 400; aktVideo.volume = ton.vol; aktVideo.muted = ton.stumm; } anzeigen(); }
function tonAnKnopf(zeigen) { const v = document.getElementById('vid'); let b = v.querySelector('.tonan'); if (!zeigen) { b && b.remove(); return; } if (b) return; b = document.createElement('button'); b.className = 'tonan'; b.textContent = '🔊 Ton einschalten'; b.onclick = (e) => { e.stopPropagation(); ton.stumm = false; merken(); tonSetzen(); aktVideo && aktVideo.play(); b.remove(); }; v.append(b); }
async function abspielen() { const vd = aktVideo; if (!vd) return; try { await vd.play(); tonAnKnopf(false); } catch (e) { if (!vd.muted) { vd._ign = performance.now() + 400; vd.muted = true; try { await vd.play(); } catch (e2) {} tonAnKnopf(!ton.stumm); } } }
function lautstaerke(d) { ton.stumm = false; ton.vol = Math.max(0, Math.min(1, Math.round((ton.vol + d) * 20) / 20)); merken(); tonSetzen(); tonAnKnopf(false); }
document.getElementById('regler').oninput = (e) => { ton.vol = +e.target.value / 100; ton.stumm = ton.vol === 0; merken(); tonSetzen(); tonAnKnopf(false); };
document.getElementById('leiser').onclick = () => lautstaerke(-0.1);
document.getElementById('lauter').onclick = () => lautstaerke(+0.1);
document.getElementById('stumm').onclick = () => { ton.stumm = !ton.stumm; merken(); tonSetzen(); tonAnKnopf(false); };
document.getElementById('nochmal').onclick = () => { if (aktVideo) { aktVideo.currentTime = 0; abspielen(); } };
document.addEventListener('keydown', (e) => { if (e.target.tagName === 'SELECT' || e.target.type === 'range') return; if (e.key === '+' ) lautstaerke(+0.1); else if (e.key === '-') lautstaerke(-0.1); else if (e.key.toLowerCase() === 'm') document.getElementById('stumm').click(); });
document.addEventListener('pointerdown', () => { if (aktVideo && aktVideo.muted && !ton.stumm) { aktVideo._ign = performance.now() + 400; aktVideo.muted = false; tonAnKnopf(false); } }, { once: true });
anzeigen();
sel.onchange = () => zeige(sel.value);
if (window.TW_FREI === true) document.getElementById('hb').style.display = 'none'; // Handbuch beschreibt KI/Drive – in der öffentlichen Fassung (noch) nicht dabei
document.getElementById('hb').onclick = () => window.open('hilfe/TW-CAD-Handbuch.pdf', '_blank');
let kanal; try { kanal = new BroadcastChannel('tw-cad-hilfe'); kanal.onmessage = (e) => { if (e.data && e.data.kontext && (document.getElementById('folgen').checked || e.data.zeigen)) zeige(e.data.kontext); }; } catch (e) {}
window.addEventListener('message', (e) => { if (e.origin === location.origin && e.data && e.data.kontext && document.getElementById('folgen').checked) zeige(e.data.kontext); });
zeige(q.get('thema') || 'start');
</script>
</body>
</html>
