<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<script src="frei-config.js?v=20261028-0429"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>TW-CAD</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12161b">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23161a20'/%3E%3Cpath d='M7 25V7h18v18z' fill='none' stroke='%23e8eaed' stroke-width='3'/%3E%3Cpath d='M7 16h18M16 7v18' stroke='%23c8102e' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/cad.css?v=20261028-0429">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
<script src="lib/clipper.js"></script>
<script src="lib/delaunator.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/pdf.min.js"></script>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><span class="logo">TW</span><span class="brand-t">CAD</span></div>
    <input id="projName" class="proj" spellcheck="false" title="Projektname">
    <nav id="views" class="views"></nav>
    <div class="top-actions" id="topActions"></div>
  </header>
  <div id="optbar" class="optbar"></div>
  <div id="main">
    <aside id="toolbox" class="toolbox"></aside>
    <section id="stage">
      <canvas id="cv"></canvas>
      <div id="view3d" class="layer hidden"></div>
      <div id="viewTiles" class="layer hidden"></div>
      <div id="viewSection" class="layer hidden"></div>
      <div id="viewPrint" class="layer hidden"></div>
      <div id="viewListen" class="layer hidden"></div>
      <div id="hud" class="hud"></div>
      <div id="dynIn" class="dynin hidden"></div>
      <div id="toast" class="toast"></div>
      <div id="stageKnoepfe" class="stage-knoepfe"></div>
    </section>
    <aside id="side" class="side">
      <div class="side-tabs" id="sideTabs"></div>
      <div class="side-body" id="sideBody"></div>
    </aside>
  </div>
  <footer id="status">
    <div class="cmd"><span class="cmd-l" id="cmdLabel">Befehl</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder="Länge tippen + Enter · @dx;dy · L&lt;Winkel"></div>
    <div class="toggles" id="toggles"></div>
    <div class="coords" id="coords">x 0 · y 0</div>
    <div class="hint" id="hint"></div>
    <div class="zwei-knoepfe"><button id="vollbildBtn" title="Zeichnung im Vollbild (F11)">⛶ Vollbild</button><button id="zweiAus" title="Werkzeug-Fenster schließen – alles wieder in einem Fenster">⧉ Ein Fenster</button></div>
  </footer>
</div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<script type="module" src="js/app.js?v=20261028-0429"></script>
</body>
</html>
